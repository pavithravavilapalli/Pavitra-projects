<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Pass Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚌 Bus Pass Validator</h1>
            <p>Validate your bus pass and check route availability</p>
        </header>

        <main>
            <section class="input-section">
                <h2>Enter Bus Pass Details</h2>
                <form id="passForm">
                    <div class="form-group">
                        <label for="passId">Pass ID:</label>
                        <input type="text" id="passId" placeholder="e.g., BP-123456" required>
                    </div>

                    <div class="form-group">
                        <label for="selectedRoute">Select Route:</label>
                        <select id="selectedRoute" required>
                            <option value="">Choose a route</option>
                            <option value="route-1">Route 1 - Downtown Express</option>
                            <option value="route-2">Route 2 - Suburban Loop</option>
                            <option value="route-3">Route 3 - Airport Service</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">Validate Pass</button>
                </form>
            </section>

            <section class="result-section">
                <h2>Validation Result</h2>
                <div id="result"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Bus Pass Validator</p>
        </footer>
    </div>
    <script src="index.js"></script>
</body>
</html>
